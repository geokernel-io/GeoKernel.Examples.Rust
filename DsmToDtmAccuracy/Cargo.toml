[package]
name = "dsm-to-dtm-accuracy"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: pinned to the published 1.5.40 SDK independently of the root workspace.
[workspace]

[dependencies]
geokernel = "=1.5.40"
serde_json = "1"
sha2 = "0.10.9"
libloading = "0.8.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Controls_Dialogs"] }
